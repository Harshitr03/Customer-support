[project]
name = "support-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.22.0",
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
# Optional local demo UI (Task 17). Not a core dependency -- install with
# `pip install -e ".[ui]"`. Lower bound pinned to the version installed and
# tested against (streamlit>=1.63.0 pulled in altair as a transitive dep,
# used for the "Results" tab's per-intent bar chart -- no extra dependency
# added beyond what streamlit itself installs).
ui = ["streamlit>=1.63.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
